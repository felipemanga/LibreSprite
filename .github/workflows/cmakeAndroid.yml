name: Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 13114758
    - name: Setup tools
      run: |
        # sudo apt-get install cmake g++ libtinyxml2-dev ninja-build
        sudo apt-get update
        sudo apt-get install g++ libcurl4-gnutls-dev libfreetype6-dev libgif-dev libjpeg-dev libpixman-1-dev libpng-dev libsdl2-dev libsdl2-image-dev libtinyxml2-dev libx11-dev libxcursor-dev ninja-build zlib1g-dev libarchive-dev
        # noble's apt cmake is 3.28 (the project needs >= 4.1) and system pip is PEP 668
        curl -fsSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-x86_64.tar.gz
        sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local --strip-components=1
        mkdir build
        cd build
        cmake -G Ninja -DGEN_ONLY=ON ..
        ninja
        cd ..
    - name: Setup Submodule
      run: git clone https://github.com/LibreSprite/ls-android-deps.git android
    - name: Build Application
      run: |
        cd android
        CMAKEPATH=$(dirname $(dirname $(which cmake)))
        echo "cmake.dir=$CMAKEPATH" > local.properties
        sh ./gradlew --no-daemon --parallel build
        cd ..
    - name: Sign release APK
      run: |
        # The gradle release build type is unsigned (ls-android-deps ships a
        # placeholder signing config), so sign with a per-run generated key.
        # For a stable signature across releases, replace this with a shared
        # keystore stored as a repo secret.
        cd android
        keytool -genkeypair -v \
          -keystore libresprite-ci.keystore \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias libresprite \
          -storepass libresprite -keypass libresprite \
          -dname "CN=LibreSprite CI"
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        APK=app/build/outputs/apk/all_in_one/release/app-all_in_one-release.apk
        "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$APK.aligned"
        mv "$APK.aligned" "$APK"
        "$BUILD_TOOLS/apksigner" sign \
          --ks libresprite-ci.keystore \
          --ks-key-alias libresprite \
          --ks-pass pass:libresprite \
          --key-pass pass:libresprite \
          "$APK"
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: libresprite-android
        path: |
          android/app/build/outputs/apk/all_in_one/release/app-all_in_one-release.apk
